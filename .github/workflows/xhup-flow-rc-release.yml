      - name: 创建草稿 Release(人工复核后发布)
        run: |
          set -euo pipefail
          cd artifacts
          prerelease_flag=()
          if [[ "$IS_RC" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "xhup-flow-v$VERSION" \
            --title "XHUP Flow v$VERSION" \
            --notes-file "$RUNNER_TEMP/RELEASE-NOTES.md" \
            "${prerelease_flag[@]}" --draft \
            --target "$SOURCE_COMMIT" \
            "xhup-flow-rime-v$RIME_VERSION.zip" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-windows-x64-setup.exe" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-windows-x64.msi" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-macos-universal.dmg" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-linux-amd64.deb" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-linux-x86_64.rpm" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-android-arm64.apk" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-android-universal.apk" \
            SHA256SUMS.txt CANONICAL-SHA256SUMS.txt BUILD-INFO.txt BUILD-MANIFEST.json ACCEPTANCE.json
          url="$(gh release view "xhup-flow-v$VERSION" --json url -q .url)"
          echo "### 草稿 Release 已创建" >> "$GITHUB_STEP_SUMMARY"
          echo "- $url(人工复核发布说明与验收状态后发布)" >> "$GITHUB_STEP_SUMMARY"
