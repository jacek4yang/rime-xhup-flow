name: XHUP Flow RC Release

# XHUP Flow 产品发布管线(人工触发;RC 与正式版共用)。
#
# 标签命名空间(与既有管线严格分离,勿混用):
# - `trainer-v<...>-alpha.N` → Trainer Alpha(trainer-alpha.yml)
# - `xhup-flow-v<version>`   → XHUP Flow 产品(本工作流;RC 与正式)
#
# 行为:
# - publish=false(演练):完整构建 + 校验 + 上传 workflow 产物;
#   不打 tag、不建 Release;
# - publish=true(发布):必须满足全部门禁(main 分支、版本一致、
#   tag/Release 不存在),构建后创建草稿 Release(RC 为 Pre-release,
#   正式版非 prerelease),人工复核发布说明与各平台验收状态后发布。
#
# 签名如实标注:桌面产物未签名/未公证(仓库无相应凭据);Android 仅在
# publish=true 时经既有密钥链路签名(密钥仅运行时注入,不入库)。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "RC 必须等于 workspace 版本;stable x.y.z 原字节晋升 schema 2 指定的同 core RC"
        required: true
        default: "1.0.0-rc.1"
      publish:
        description: "发布(创建草稿 Release;正式版非 prerelease;必须 main 分支)"
        required: true
        type: boolean
        default: false
      android_version_code:
        description: "Android versionCode 覆盖(空 = 从版本确定性派生,单调递增)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: xhup-flow-rc-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: 版本一致性与发布门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      core: ${{ steps.meta.outputs.core }}
      is_rc: ${{ steps.meta.outputs.is_rc }}
      publish: ${{ steps.meta.outputs.publish }}
      android_version_code: ${{ steps.meta.outputs.android_version_code }}
      acceptance_windows: ${{ steps.meta.outputs.acceptance_windows }}
      acceptance_linux: ${{ steps.meta.outputs.acceptance_linux }}
      acceptance_macos: ${{ steps.meta.outputs.acceptance_macos }}
      acceptance_android: ${{ steps.meta.outputs.acceptance_android }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 校验发布元数据
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_VCODE: ${{ inputs.android_version_code }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if ! [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-rc\.([1-9][0-9]*))?$ ]]; then
            echo "::error::版本 '$version' 不合法,必须形如 1.0.0-rc.1(RC)或 1.0.0(正式),且不得复用 alpha 命名空间"
            exit 1
          fi
          core="${BASH_REMATCH[1]}"
          if [[ -n "${BASH_REMATCH[2]}" ]]; then is_rc=true; else is_rc=false; fi
          # 空 = 由打包工作流从版本确定性派生(单一事实来源);显式传入时须为正整数。
          if [[ -n "$INPUT_VCODE" ]] && ! [[ "$INPUT_VCODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::android_version_code '$INPUT_VCODE' 必须是 >= 1 的正整数,或留空自动派生"
            exit 1
          fi
          # 版本一致性:完整发布版本必须同时等于全部产品级版本来源
          # (Rime 源包版本 = workspace 版本,由生成器内嵌;
          #  trainer/src-tauri 测试 product_versions_are_synchronized
          #  在 CI 中强制同一不变量)。
          # 注意:必须比较完整 version(含 -rc.N 后缀),core 只用于
          # is_rc 判定与摘要展示 —— 用 core 比较会在 RC 路径下把
          # 2.0.0-rc.1 与 2.0.0 误判为跳版(v1 时代 1.0.0 无后缀,未暴露)。
          ws="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          check_version() {
            local label="$1" actual="$2"
            if [[ "$version" != "$actual" ]]; then
              echo "::error::version '$version' != $label '$actual'(先统一升版,不得静默跳版)"
              exit 1
            fi
          }
          if [[ "$is_rc" == "true" ]]; then
            check_version "workspace 版本" "$ws"
            for pkg in trainer/src-tauri/tauri.conf.json trainer/package.json \
                       miniapp/package.json packages/trainer-core/package.json; do
              actual="$(node -p "JSON.parse(require('fs').readFileSync('$pkg','utf8')).version")"
              check_version "$pkg" "$actual"
            done
          fi
          # Stable promotes unchanged RC bytes: workspace/app versions remain RC.
          publish="$INPUT_PUBLISH"
          if [[ "$publish" == "true" ]]; then
            if [[ "$REF" != "refs/heads/main" ]]; then
              echo "::error::publish=true 只允许在 main 分支运行(当前 ref: $REF)"
              exit 1
            fi
            tag="xhup-flow-v$version"
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::tag 已存在: $tag(发布版本不可变;RC 请递增 rc 序号)"
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::Release 已存在: $tag"
              exit 1
            fi
          fi
          # 机器可读 GA 门禁(#148 §3):清单 release/acceptance-v<core>.json。
          # RC:结构合法且无 FAIL 即可(UNVERIFIED 放行 —— 硬件验收可后补);
          # 此处仅做结构/FAIL 预检。stable 的完整源/附件/证据门禁在 prepare,
          # 下载已接受 RC 后执行;没有 prepare 成功就不能发布。
          manifest="release/acceptance-v$core.json"
          gate_args=(validate-acceptance --manifest "$manifest")
          gate_mode="rc"
          if [[ "$is_rc" == "false" ]]; then
            gate_mode="stable-preflight"
          fi
          cargo run -q -p xhup-cli --locked -- "${gate_args[@]}" \
            || { echo "::error::GA 验收门禁($gate_mode)未通过: $manifest"; exit 1; }
          {
            echo "version=$version"
            echo "core=$core"
            echo "is_rc=$is_rc"
            echo "publish=$publish"
            echo "android_version_code=$INPUT_VCODE"
            # 稳定版发布说明用真实验收状态(#148 §3):逐平台压缩为
            # "platform=worst_state",由 acceptance 模块确定性推导。
            acc_summary="$(cargo run -q -p xhup-cli --locked -- acceptance-summary --manifest "$manifest")"
            # Never present historical rc1 evidence as acceptance of a later RC.
            if [[ "$is_rc" == "true" ]] && ! jq -e --arg v "$version" --arg s "$GITHUB_SHA" \
              '.version == $v and .source_commit == $s' "$manifest" >/dev/null; then
              acc_summary=$'windows=UNVERIFIED\nlinux=UNVERIFIED\nmacos=UNVERIFIED\nandroid=UNVERIFIED'
            fi
            {
              while IFS= read -r line; do echo "acceptance_$line"; done <<< "$acc_summary"
            } >> "$GITHUB_OUTPUT"
          } >> "$GITHUB_OUTPUT"
          {
            if [[ "$is_rc" == "true" ]]; then kind="RC(Pre-release)"; else kind="正式版(stable)"; fi
            echo "### 发布元数据"
            echo "- 版本: \`$version\`(core \`$core\`,$kind;RC 同步产品版本,stable 保留受验 RC 字节)"
            if [[ -n "$INPUT_VCODE" ]]; then
              echo "- Android versionCode: \`$INPUT_VCODE\`(显式覆盖)"
            else
              echo "- Android versionCode: 从版本确定性派生(单调递增)"
            fi
            echo "- 发布: \`$publish\`(true = 草稿 Release,人工复核后发布)"
            echo "- 桌面签名状态: UNSIGNED / UNNOTARIZED(仓库无相应凭据,如实标注)"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 构建全部产物
    needs: validate
    if: needs.validate.outputs.is_rc == 'true'
    uses: ./.github/workflows/product-packaging.yml
    # secrets: inherit 仅用于 publish=true 时的 Android 发布签名;
    # PR/演练路径不读取任何 secret(打包工作流内按 sign_android 门控)。
    secrets: inherit
    with:
      version: ${{ needs.validate.outputs.version }}
      android_version_code: ${{ needs.validate.outputs.android_version_code }}
      sign_android: ${{ needs.validate.outputs.publish == 'true' }}
      build_state: ${{ needs.validate.outputs.publish != 'true' && 'RC-REHEARSAL' || (needs.validate.outputs.is_rc == 'true' && 'RC-PUBLISH' || 'RELEASE') }}
      # R6 决策(#143):arm64-v8a 单 ABI(实测 139.6 MiB)为主发布产物,
      # universal 4-ABI(551.0 MiB)保留为兼容附加资产。
      arm64_default: true

  prepare:
    name: RC 构建封存或 stable 原字节晋升
    needs: [validate, build]
    if: >-
      ${{ always() && needs.validate.result == 'success' &&
          (needs.validate.outputs.is_rc == 'false' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_version: ${{ steps.bundle.outputs.artifact_version }}
      source_commit: ${{ steps.bundle.outputs.source_commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
      CORE: ${{ needs.validate.outputs.core }}
      IS_RC: ${{ needs.validate.outputs.is_rc }}
      PUBLISH: ${{ needs.validate.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: 下载本次 RC 构建
        if: needs.validate.outputs.is_rc == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: product-packaging-*
          path: artifacts
          merge-multiple: true
      - name: 封存或验证实际发布字节
        id: bundle
        run: |
          set -euo pipefail
          manifest="release/acceptance-v$CORE.json"
          if [[ "$IS_RC" == "true" ]]; then
            artifact_version="$VERSION"
            source_commit="$GITHUB_SHA"
            # Unsigned rehearsal artifacts are not promotable; preserve that distinction.
            if [[ "$PUBLISH" == "true" ]]; then
              cargo run -q -p xhup-cli --locked -- seal-build \
                --version "$VERSION" --source-commit "$source_commit" --artifacts-dir artifacts
            fi
          else
            artifact_version="$(jq -er '.accepted_rc' "$manifest")"
            [[ "$artifact_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]]
            [[ "${artifact_version%-rc.*}" == "$VERSION" ]]
            tag="xhup-flow-v$artifact_version"
            gh release view "$tag" --json isDraft,isPrerelease \
              --jq 'select(.isDraft == false and .isPrerelease == true)' | jq -e . >/dev/null
            # Resolve annotated/lightweight tag to a real commit, not manifest assertions.
            source_commit="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)"
            mkdir artifacts
            gh release download "$tag" --dir artifacts
            # Acceptance is attached separately; it is not part of the sealed payload.
            rm -f artifacts/ACCEPTANCE.json
            cargo run -q -p xhup-cli --locked -- validate-acceptance \
              --manifest "$manifest" --stable --expect-version "$VERSION" \
              --expect-source "$source_commit" --artifacts-dir artifacts
          fi
          cp "$manifest" artifacts/ACCEPTANCE.json
          {
            echo "artifact_version=$artifact_version"
            echo "source_commit=$source_commit"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-verified-payload
          path: artifacts/
          retention-days: 7

  publish:
    name: 创建草稿 Release
    needs: [validate, prepare]
    if: >-
      ${{ always() && needs.validate.result == 'success' &&
          needs.prepare.result == 'success' && needs.validate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
      CORE: ${{ needs.validate.outputs.core }}
      IS_RC: ${{ needs.validate.outputs.is_rc }}
      # Rime 源包文件名携带其内嵌版本(schema version 行 = workspace 版本,
      # 含 -rc.N 后缀);不能用 CORE(剥后缀)拼名,RC 路径下会校验失败。
      # v1 时代 CORE == VERSION == 1.0.0,两者巧合一致,缺陷未暴露。
      RIME_VERSION: ${{ needs.prepare.outputs.artifact_version }}
      ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}

    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v8
        with:
          name: release-verified-payload
          path: artifacts

      - name: 发布前校验
        run: |
          set -euo pipefail
          cd artifacts
          for f in \
            "xhup-flow-rime-v$RIME_VERSION.zip" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-windows-x64-setup.exe" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-windows-x64.msi" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-macos-universal.dmg" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-linux-amd64.deb" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-linux-x86_64.rpm" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-android-arm64.apk" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-android-universal.apk" \
            SHA256SUMS.txt CANONICAL-SHA256SUMS.txt BUILD-INFO.txt BUILD-MANIFEST.json ACCEPTANCE.json; do
            [[ -s "$f" ]] || { echo "::error::缺少发布资产或为 0 字节: $f"; exit 1; }
          done
          # 完整性自检:SHA256SUMS 与现盘产物一致。
          sha256sum --check SHA256SUMS.txt
          echo "发布前校验通过:资产齐备、校验和一致"

      - name: 组装发布说明(草稿,人工复核)
        env:
          ACC_WINDOWS: ${{ needs.validate.outputs.acceptance_windows }}
          ACC_LINUX: ${{ needs.validate.outputs.acceptance_linux }}
          ACC_MACOS: ${{ needs.validate.outputs.acceptance_macos }}
          ACC_ANDROID: ${{ needs.validate.outputs.acceptance_android }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/RELEASE-NOTES.md"
          # 平台状态来自机器可读验收清单的确定性推导(validate 输出),
          # 不得手写硬编码 —— 稳定版门禁保证无 UNVERIFIED/FAIL 才会走到这里。
          if [[ "$IS_RC" == "true" ]]; then
            title_suffix="(Release Candidate)"
            banner="> **草稿 Pre-release**:各平台人工验收状态以机器可读清单
          > release/acceptance-v$CORE.json 为准(UNVERIFIED = 待真机验收),
          > 人工复核本说明并更新验收状态后手动发布。"
            acceptance="
          ## 人工验收状态(源:release/acceptance-v$CORE.json)

          - Windows: **${ACC_WINDOWS:-UNVERIFIED}**
          - Linux: **${ACC_LINUX:-UNVERIFIED}**
          - macOS: **${ACC_MACOS:-UNVERIFIED}**
          - Android: **${ACC_ANDROID:-UNVERIFIED}**
          "
          else
            title_suffix=""
            banner="> 正式稳定版本。各平台验收状态来自机器可读清单
          > release/acceptance-v$CORE.json(schema 2,完整证据及源/工件哈希验证)。
          > 原字节晋升 RC $ARTIFACT_VERSION,附件名称及内嵌版本仍为 RC;不重新构建。"
            acceptance="
          ## 平台验收状态(schema 2:必查 PASS;仅 Android 桌面生命周期可有理由 N/A)

          - Windows: **${ACC_WINDOWS:-UNVERIFIED}**
          - Linux: **${ACC_LINUX:-UNVERIFIED}**
          - macOS: **${ACC_MACOS:-UNVERIFIED}**
          - Android: **${ACC_ANDROID:-UNVERIFIED}**
          "
          fi
          cat > "$notes" <<EOF
          # XHUP Flow v$VERSION$title_suffix

          $banner

          ## 这是什么

          XHUP Flow:冻结静态层(一级简码 / 单字全码 / 词语简码 / 固定词)
          之上的连续组句与本地学习输入方案,配套训练器(12 种练习模式、
          错题中心、统计)与输入法控制中心(安装 / 升级 / 修复 / 卸载 /
          重新部署 / 学习管理 / 诊断)。

          ## 输入能力

          - 小鹤双拼 + 音形全码(单字 2~4 键、词语 4/6/8 键);
          - 一级简码(26 键冻结映射)与 canonical v2 词语简码
            (68,842 条 = 65,909 PRIMARY + 2,933 FIXED_FIRST);
          - baseline / PRIMARY / FIXED_FIRST 同码候选以显式 merged rank
            的唯一整数权重排序,不受学习或词典导入顺序影响;
          - Flow 连续组句:整句输入、逐键组句、句子级本地学习;
          - Lua 简码提示:长码候选标注可用简码(支持 librime-lua 的平台
            自动启用,无插件环境完整降级为纯静态行为);
          - 两个方案:\`xhup_flow\`(默认,现代模式)与
            \`xhup_flow_static\`(纯静态,无 Lua、无学习)。

          ## P0 开放输入修复

          - 8,105 个《通用规范汉字表》字符继续作为可审计的规范核心子集，不再充当整个输入法的字符边界；
          - 新增带来源与固定版本的扩展输入事实层：当前覆盖 8,208 个输入字符、9,796 条事实记录，
            包括小鹤官网核验的 \`嗯=ogkx/onkx/enkx-\` 与兼容编码 \`诶=eiyu\`；
          - 保留 100,000 条 hot 词用于高质量静态排序，同时加入 1,301,434 条固定上游版本的
            extended 词汇关系；词库层只决定候选质量，不再决定词汇是否可达；
          - Flow 词典包含逐字两键音码原语，可生成词表外短语和含单字、结构助词、语气词的真实长句；
            \`提示词(tiuici)\` 可达，且不依赖手工特例；
          - 高优先级静态 exact 菜单保持前缀不变，开放组合仅追加候选，不触发意外自动上屏。
          - Flow/Learn 共享 userdb 的 syllable-id 空间保持一致，扩词后本地学习、重启与快照恢复继续可用。

          ## 下载与安装

          ### 桌面 / Android 训练器(含输入法管理)

          按下表下载对应平台安装包,安装后打开「控制中心」可一键安装 /
          修复 / 卸载 XHUP Flow 的 Rime 方案文件(安全合并,不破坏既有
          配置)。

          ### 仅使用 Rime 输入方案(已有 Rime 客户端)

          1. 下载 \`xhup-flow-rime-v$RIME_VERSION.zip\`;
          2. 找到 Rime 用户数据目录(小狼毫: %%APPDATA%%\\Rime;
             鼠须管: ~/Library/Rime;fcitx5: ~/.local/share/fcitx5/rime;
             ibus: ~/.config/ibus/rime);
          3. 把 ZIP 内容**直接解压到该目录**,允许覆盖同名文件
             (ZIP 内只有 XHUP Flow 拥有的方案/词典/Lua 模块文件);
          4. 重新部署(Deploy);
          5. 在方案选单中启用 XHUP Flow。

          该 ZIP **刻意不含** \`default.custom.yaml\`、
          \`default.yaml\`、\`installation.yaml\`、\`user.yaml\`、
          \`sync/\`、\`*.userdb\`,不会覆盖你的其他输入方案、用户词典、
          同步数据与个人状态。启用方案需自行在 \`default.custom.yaml\` 的
          \`schema_list\` 追加 \`xhup_flow\`(或用客户端的方案选单)。

          ## 产物与签名状态

          | 文件 | 平台 | 签名状态 |
          | ---- | ---- | ---- |
          | \`xhup-flow-rime-v$RIME_VERSION.zip\` | 平台中立 Rime 源包 | N/A(SHA256 校验) |
          | \`xhup-flow-trainer-v$ARTIFACT_VERSION-windows-x64-setup.exe\` | Windows(NSIS) | UNSIGNED |
          | \`xhup-flow-trainer-v$ARTIFACT_VERSION-windows-x64.msi\` | Windows(MSI) | UNSIGNED |
          | \`xhup-flow-trainer-v$ARTIFACT_VERSION-macos-universal.dmg\` | macOS(aarch64+x86_64) | UNSIGNED + UNNOTARIZED |
          | \`xhup-flow-trainer-v$ARTIFACT_VERSION-linux-amd64.deb\` | Linux(deb) | N/A |
          | \`xhup-flow-trainer-v$ARTIFACT_VERSION-linux-x86_64.rpm\` | Linux(rpm) | N/A |
          | \`xhup-flow-trainer-v$ARTIFACT_VERSION-android-arm64.apk\` | Android(主产物,arm64-v8a) | SIGNED |
          | \`xhup-flow-trainer-v$ARTIFACT_VERSION-android-universal.apk\` | Android(兼容附加,4-ABI) | SIGNED |

          - 完整性:安装前比对 \`SHA256SUMS.txt\`。
          - 构建元数据:\`BUILD-INFO.txt\`;规范数据确定性哈希:
            \`CANONICAL-SHA256SUMS.txt\`。
          - Windows 未签名:SmartScreen 可能提示「未知发布者」,属预期,
            请勿为此关闭系统安全防护。
