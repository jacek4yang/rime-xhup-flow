name: XHUP Flow RC Release

# XHUP Flow 产品发布管线(人工触发;RC 与正式版共用)。
#
# 标签命名空间(与既有管线严格分离,勿混用):
# - `trainer-v<...>-alpha.N` → Trainer Alpha(trainer-alpha.yml)
# - `xhup-flow-v<version>`   → XHUP Flow 产品(本工作流;RC 与正式)
#
# 行为:
# - publish=false(演练):完整构建 + 校验 + 上传 workflow 产物;
#   不打 tag、不建 Release;
# - publish=true(发布):必须满足全部门禁(main 分支、版本一致、
#   tag/Release 不存在),构建后创建草稿 Release(RC 为 Pre-release,
#   正式版非 prerelease),人工复核发布说明与各平台验收状态后发布。
#
# 签名如实标注:桌面产物未签名/未公证(仓库无相应凭据);Android 仅在
# publish=true 时经既有密钥链路签名(密钥仅运行时注入,不入库)。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本,例如 1.0.0-rc.1(RC)或 1.0.0(正式;core 必须与 workspace/tauri.conf 版本一致)"
        required: true
        default: "1.0.0-rc.1"
      publish:
        description: "发布(创建草稿 Release;正式版非 prerelease;必须 main 分支)"
        required: true
        type: boolean
        default: false
      android_version_code:
        description: "Android versionCode 覆盖(空 = 从版本确定性派生,单调递增)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: xhup-flow-rc-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: 版本一致性与发布门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      core: ${{ steps.meta.outputs.core }}
      is_rc: ${{ steps.meta.outputs.is_rc }}
      publish: ${{ steps.meta.outputs.publish }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 校验发布元数据
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_VCODE: ${{ inputs.android_version_code }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if ! [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-rc\.([1-9][0-9]*))?$ ]]; then
            echo "::error::版本 '$version' 不合法,必须形如 1.0.0-rc.1(RC)或 1.0.0(正式),且不得复用 alpha 命名空间"
            exit 1
          fi
          core="${BASH_REMATCH[1]}"
          if [[ -n "${BASH_REMATCH[2]}" ]]; then is_rc=true; else is_rc=false; fi
          # 空 = 由打包工作流从版本确定性派生(单一事实来源);显式传入时须为正整数。
          if [[ -n "$INPUT_VCODE" ]] && ! [[ "$INPUT_VCODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::android_version_code '$INPUT_VCODE' 必须是 >= 1 的正整数,或留空自动派生"
            exit 1
          fi
          # 版本一致性:core 必须同时等于全部产品级版本来源
          # (Rime 源包版本 = workspace 版本,由生成器内嵌;
          #  trainer/src-tauri 测试 product_versions_are_synchronized
          #  在 CI 中强制同一不变量)。
          ws="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          check_version() {
            local label="$1" actual="$2"
            if [[ "$core" != "$actual" ]]; then
              echo "::error::core '$core' != $label '$actual'(先统一升版,不得静默跳版)"
              exit 1
            fi
          }
          check_version "workspace 版本" "$ws"
          for pkg in trainer/src-tauri/tauri.conf.json trainer/package.json \
                     miniapp/package.json packages/trainer-core/package.json; do
            actual="$(node -p "JSON.parse(require('fs').readFileSync('$pkg','utf8')).version")"
            check_version "$pkg" "$actual"
          done
          publish="$INPUT_PUBLISH"
          if [[ "$publish" == "true" ]]; then
            if [[ "$REF" != "refs/heads/main" ]]; then
              echo "::error::publish=true 只允许在 main 分支运行(当前 ref: $REF)"
              exit 1
            fi
            tag="xhup-flow-v$version"
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::tag 已存在: $tag(发布版本不可变;RC 请递增 rc 序号)"
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::Release 已存在: $tag"
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "core=$core"
            echo "is_rc=$is_rc"
            echo "publish=$publish"
            echo "android_version_code=$INPUT_VCODE"
          } >> "$GITHUB_OUTPUT"
          {
            if [[ "$is_rc" == "true" ]]; then kind="RC(Pre-release)"; else kind="正式版(stable)"; fi
            echo "### 发布元数据"
            echo "- 版本: \`$version\`(core \`$core\`,$kind,workspace/app/前端包一致)"
            if [[ -n "$INPUT_VCODE" ]]; then
              echo "- Android versionCode: \`$INPUT_VCODE\`(显式覆盖)"
            else
              echo "- Android versionCode: 从版本确定性派生(单调递增)"
            fi
            echo "- 发布: \`$publish\`(true = 草稿 Release,人工复核后发布)"
            echo "- 桌面签名状态: UNSIGNED / UNNOTARIZED(仓库无相应凭据,如实标注)"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 构建全部产物
    needs: validate
    uses: ./.github/workflows/product-packaging.yml
    # secrets: inherit 仅用于 publish=true 时的 Android 发布签名;
    # PR/演练路径不读取任何 secret(打包工作流内按 sign_android 门控)。
    secrets: inherit
    with:
      version: ${{ needs.validate.outputs.version }}
      android_version_code: ${{ needs.validate.outputs.android_version_code }}
      sign_android: ${{ needs.validate.outputs.publish == 'true' }}
      build_state: ${{ needs.validate.outputs.publish != 'true' && 'RC-REHEARSAL' || (needs.validate.outputs.is_rc == 'true' && 'RC-PUBLISH' || 'RELEASE') }}

  publish:
    name: 创建草稿 Release
    needs: [validate, build]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
      CORE: ${{ needs.validate.outputs.core }}
      IS_RC: ${{ needs.validate.outputs.is_rc }}

    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v8
        with:
          pattern: product-packaging-*
          path: artifacts
          merge-multiple: true

      - name: 发布前校验
        run: |
          set -euo pipefail
          cd artifacts
          for f in \
            "xhup-flow-rime-v$CORE.zip" \
            "xhup-flow-trainer-v$VERSION-windows-x64-setup.exe" \
            "xhup-flow-trainer-v$VERSION-windows-x64.msi" \
            "xhup-flow-trainer-v$VERSION-macos-universal.dmg" \
            "xhup-flow-trainer-v$VERSION-linux-amd64.deb" \
            "xhup-flow-trainer-v$VERSION-linux-x86_64.rpm" \
            "xhup-flow-trainer-v$VERSION-android-universal.apk" \
            SHA256SUMS.txt CANONICAL-SHA256SUMS.txt BUILD-INFO.txt; do
            [[ -s "$f" ]] || { echo "::error::缺少发布资产或为 0 字节: $f"; exit 1; }
          done
          # 完整性自检:SHA256SUMS 与现盘产物一致。
          sha256sum --check SHA256SUMS.txt
          echo "发布前校验通过:资产齐备、校验和一致"

      - name: 组装发布说明(草稿,人工复核)
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/RELEASE-NOTES.md"
          if [[ "$IS_RC" == "true" ]]; then
            title_suffix="(Release Candidate)"
            banner="> **草稿 Pre-release**:各平台人工验收状态均为 UNVERIFIED,
          > 人工复核本说明并更新验收状态后手动发布。"
            acceptance="
          ## 人工验收状态

          - Windows: **UNVERIFIED**
          - macOS: **UNVERIFIED**
          - Linux: **UNVERIFIED**
          - Android: **UNVERIFIED**
          "
          else
            title_suffix=""
            banner="> 首个正式稳定版本。各平台人工验收状态见下方,
          > 人工复核本说明后发布(正式版,非 Pre-release)。"
            acceptance="
          ## 人工验收状态

          - Windows: **UNVERIFIED**
          - macOS: **UNVERIFIED**
          - Linux: **UNVERIFIED**
          - Android: **UNVERIFIED**
          "
          fi
          cat > "$notes" <<EOF
          # XHUP Flow v$VERSION$title_suffix

          $banner

          ## 这是什么

          XHUP Flow:冻结静态层(一级简码 / 单字全码 / 词语简码 / 固定词)
          之上的连续组句与本地学习输入方案,配套训练器(12 种练习模式、
          错题中心、统计)与输入法控制中心(安装 / 升级 / 修复 / 卸载 /
          重新部署 / 学习管理 / 诊断)。

          ## 输入能力

          - 小鹤双拼 + 音形全码(单字 2~4 键、词语 4/6/8 键);
          - 一级简码(26 键冻结映射)与 canonical v2 词语简码
            (68,842 条 = 65,909 PRIMARY + 2,933 FIXED_FIRST);
          - baseline / PRIMARY / FIXED_FIRST 同码候选以显式 merged rank
            的唯一整数权重排序,不受学习或词典导入顺序影响;
          - Flow 连续组句:整句输入、逐键组句、句子级本地学习;
          - Lua 简码提示:长码候选标注可用简码(支持 librime-lua 的平台
            自动启用,无插件环境完整降级为纯静态行为);
          - 两个方案:\`xhup_flow\`(默认,现代模式)与
            \`xhup_flow_static\`(纯静态,无 Lua、无学习)。

          ## 下载与安装

          ### 桌面 / Android 训练器(含输入法管理)

          按下表下载对应平台安装包,安装后打开「控制中心」可一键安装 /
          修复 / 卸载 XHUP Flow 的 Rime 方案文件(安全合并,不破坏既有
          配置)。

          ### 仅使用 Rime 输入方案(已有 Rime 客户端)

          1. 下载 \`xhup-flow-rime-v$CORE.zip\`;
          2. 找到 Rime 用户数据目录(小狼毫: %%APPDATA%%\\Rime;
             鼠须管: ~/Library/Rime;fcitx5: ~/.local/share/fcitx5/rime;
             ibus: ~/.config/ibus/rime);
          3. 把 ZIP 内容**直接解压到该目录**,允许覆盖同名文件
             (ZIP 内只有 XHUP Flow 拥有的方案/词典/Lua 模块文件);
          4. 重新部署(Deploy);
          5. 在方案选单中启用 XHUP Flow。

          该 ZIP **刻意不含** \`default.custom.yaml\`、
          \`default.yaml\`、\`installation.yaml\`、\`user.yaml\`、
          \`sync/\`、\`*.userdb\`,不会覆盖你的其他输入方案、用户词典、
          同步数据与个人状态。启用方案需自行在 \`default.custom.yaml\` 的
          \`schema_list\` 追加 \`xhup_flow\`(或用客户端的方案选单)。

          ## 产物与签名状态

          | 文件 | 平台 | 签名状态 |
          | ---- | ---- | ---- |
          | \`xhup-flow-rime-v$CORE.zip\` | 平台中立 Rime 源包 | N/A(SHA256 校验) |
          | \`xhup-flow-trainer-v$VERSION-windows-x64-setup.exe\` | Windows(NSIS) | UNSIGNED |
          | \`xhup-flow-trainer-v$VERSION-windows-x64.msi\` | Windows(MSI) | UNSIGNED |
          | \`xhup-flow-trainer-v$VERSION-macos-universal.dmg\` | macOS(aarch64+x86_64) | UNSIGNED + UNNOTARIZED |
          | \`xhup-flow-trainer-v$VERSION-linux-amd64.deb\` | Linux(deb) | N/A |
          | \`xhup-flow-trainer-v$VERSION-linux-x86_64.rpm\` | Linux(rpm) | N/A |
          | \`xhup-flow-trainer-v$VERSION-android-universal.apk\` | Android(通用) | SIGNED |

          - 完整性:安装前比对 \`SHA256SUMS.txt\`。
          - 构建元数据:\`BUILD-INFO.txt\`;规范数据确定性哈希:
            \`CANONICAL-SHA256SUMS.txt\`。
          - Windows 未签名:SmartScreen 可能提示「未知发布者」,属预期,
            请勿为此关闭系统安全防护。
          - macOS 未公证:首次打开需右键 → 打开,或在系统设置中放行。

          ## Canonical v2 验证

          - KdConv top-2000 replay:KSPC 1.8971,rank1 96.9544%,
            rank≤3 99.9120%;
          - 140,664 个静态 exact code 逐菜单 librime 审计;
          - 传统别名 `就是=jqu`、`知道=vdc`、`不是=buu`、
            `你们=nim`、`还是=hdu`、`因为=yww`、`如果=rgo`
            由 runtime rank1 哨兵锁定。
          $acceptance
          ## 已知限制

          - 学习导出/导入依赖 librime 官方 \`rime_dict_manager\`(librime-bin)。
          - librime 内置短语编码器的学习码为内部派生(不读作小鹤语义);
            动态候选恒排在全部静态候选之后。
          - AppImage 暂不构建(外部 linuxdeploy 网络约束)。

          ## 隐私

          本地运行:无账号、无遥测、无云端同步;学习数据仅存本机
          \`xhup_flow_user.userdb\`,可通过控制中心或 \`xhup-cli learning\`
          导出 / 恢复 / 重置。
          EOF
          echo "notes=$notes" >> "$GITHUB_ENV"

      - name: 创建草稿 Release(人工复核后发布)
        run: |
          set -euo pipefail
          cd artifacts
          prerelease_flag=()
          if [[ "$IS_RC" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "xhup-flow-v$VERSION" \
            --title "XHUP Flow v$VERSION" \
            --notes-file "$RUNNER_TEMP/RELEASE-NOTES.md" \
            "${prerelease_flag[@]}" --draft \
            --target "$GITHUB_SHA" \
            "xhup-flow-rime-v$CORE.zip" \
            "xhup-flow-trainer-v$VERSION-windows-x64-setup.exe" \
            "xhup-flow-trainer-v$VERSION-windows-x64.msi" \
            "xhup-flow-trainer-v$VERSION-macos-universal.dmg" \
            "xhup-flow-trainer-v$VERSION-linux-amd64.deb" \
            "xhup-flow-trainer-v$VERSION-linux-x86_64.rpm" \
            "xhup-flow-trainer-v$VERSION-android-universal.apk" \
            SHA256SUMS.txt CANONICAL-SHA256SUMS.txt BUILD-INFO.txt
          url="$(gh release view "xhup-flow-v$VERSION" --json url -q .url)"
          echo "### 草稿 Release 已创建" >> "$GITHUB_STEP_SUMMARY"
          echo "- $url(人工复核发布说明与验收状态后发布)" >> "$GITHUB_STEP_SUMMARY"
