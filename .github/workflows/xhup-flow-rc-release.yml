name: XHUP Flow RC Release

# XHUP Flow 产品发布管线(人工触发;RC 与正式版共用)。
#
# 标签命名空间(与既有管线严格分离,勿混用):
# - `trainer-v<...>-alpha.N` → Trainer Alpha(trainer-alpha.yml)
# - `xhup-flow-v<version>`   → XHUP Flow 产品(本工作流;RC 与正式)
#
# 行为:
# - RC:构建当前源码版本;publish=true 时签名 Android 并创建草稿 Pre-release。
# - stable:消费独立 Product Packaging run 的正式版本原字节;必须重新完成
#   当前字节的平台验收、同源 CI 与全量原生证明，不从 RC 附件晋升。
# - publish=false 不创建 tag/Release;所有公开版本仍须人工复核草稿。
#
# 签名如实标注:桌面产物未签名/未公证(仓库无相应凭据);Android 仅在
# publish=true 时经既有密钥链路签名(密钥仅运行时注入,不入库)。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "目标完整版本；RC 现构建，stable 必须是独立封存且重新验收的正式版本"
        required: true
      publish:
        description: "发布(创建草稿 Release;正式版非 prerelease;必须 main 分支)"
        required: true
        type: boolean
        default: false
      package_run:
        description: "stable 必填：成功的独立 Product Packaging run ID；RC 留空"
        required: false
        default: ""
      android_version_code:
        description: "Android versionCode 覆盖(空 = 从版本确定性派生,单调递增)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: xhup-flow-rc-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: 版本一致性与发布门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      core: ${{ steps.meta.outputs.core }}
      is_rc: ${{ steps.meta.outputs.is_rc }}
      publish: ${{ steps.meta.outputs.publish }}
      android_version_code: ${{ steps.meta.outputs.android_version_code }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 校验发布元数据
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_VCODE: ${{ inputs.android_version_code }}
          INPUT_PACKAGE_RUN: ${{ inputs.package_run }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::版本必须是规范 x.y.z 或 x.y.z-rc.N"
            exit 1
          fi
          core="${version%-rc.*}"
          if [[ "$version" != "$core" ]]; then is_rc=true; else is_rc=false; fi
          if [[ "$is_rc" == true ]]; then
            [[ -z "$INPUT_PACKAGE_RUN" ]] || { echo '::error::RC 不接受旧构建覆盖'; exit 1; }
          else
            [[ "$INPUT_PACKAGE_RUN" =~ ^[1-9][0-9]*$ ]] || { echo '::error::stable 必须指定独立打包 run'; exit 1; }
          fi
          # 空 = 由打包工作流从版本确定性派生(单一事实来源);显式传入时须为正整数。
          if [[ -n "$INPUT_VCODE" ]] && ! [[ "$INPUT_VCODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::android_version_code '$INPUT_VCODE' 必须是 >= 1 的正整数,或留空自动派生"
            exit 1
          fi
          # RC 在本次源码上构建；stable 的源版本已在独立打包 run 中核验。
          # 发布验收记录可晚于构建提交，不能把记录提交误当产物源码。
          if [[ "$is_rc" == "true" ]]; then
            python3 tests/release/check_product_version.py --expect-version "$version"
          fi
          publish="$INPUT_PUBLISH"
          if [[ "$publish" == "true" ]]; then
            if [[ "$REF" != "refs/heads/main" ]]; then
              echo "::error::publish=true 只允许在 main 分支运行(当前 ref: $REF)"
              exit 1
            fi
            tag="xhup-flow-v$version"
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::tag 已存在: $tag(发布版本不可变;RC 请递增 rc 序号)"
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::Release 已存在: $tag"
              exit 1
            fi
          fi
          if [[ "$is_rc" == "false" ]]; then
            [[ -s "release/acceptance-v$core.json" && -s "release/qualification-v$version.json" ]] \
              || { echo "::error::缺少当前正式版本的验收/资格记录"; exit 1; }
          fi
          {
            echo "version=$version"
            echo "core=$core"
            echo "is_rc=$is_rc"
            echo "publish=$publish"
            echo "android_version_code=$INPUT_VCODE"
          } >> "$GITHUB_OUTPUT"
          {
            if [[ "$is_rc" == "true" ]]; then kind="RC(Pre-release)"; else kind="正式版(stable)"; fi
            echo "### 发布元数据"
            echo "- 版本: \`$version\`(core \`$core\`,$kind;安装包内部版本必须一致)"
            if [[ -n "$INPUT_VCODE" ]]; then
              echo "- Android versionCode: \`$INPUT_VCODE\`(显式覆盖)"
            else
              echo "- Android versionCode: 从版本确定性派生(单调递增)"
            fi
            echo "- 发布: \`$publish\`(true = 草稿 Release,人工复核后发布)"
            echo "- 桌面签名状态: UNSIGNED / UNNOTARIZED(仓库无相应凭据,如实标注)"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 构建全部产物
    needs: validate
    if: needs.validate.outputs.is_rc == 'true'
    uses: ./.github/workflows/product-packaging.yml
    # secrets: inherit 仅用于 publish=true 时的 Android 发布签名;
    # PR/演练路径不读取任何 secret(打包工作流内按 sign_android 门控)。
    secrets: inherit
    with:
      version: ${{ needs.validate.outputs.version }}
      android_version_code: ${{ needs.validate.outputs.android_version_code }}
      sign_android: ${{ needs.validate.outputs.publish == 'true' }}
      build_state: ${{ needs.validate.outputs.publish != 'true' && 'RC-REHEARSAL' || (needs.validate.outputs.is_rc == 'true' && 'RC-PUBLISH' || 'RELEASE') }}
      # R6 决策(#143):arm64-v8a 单 ABI(实测 139.6 MiB)为主发布产物,
      # universal 4-ABI(551.0 MiB)保留为兼容附加资产。
      arm64_default: true

  prepare:
    name: 核验当前版本封存字节与验收来源
    needs: [validate, build]
    if: >-
      ${{ always() && needs.validate.result == 'success' &&
          (needs.validate.outputs.is_rc == 'false' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_version: ${{ steps.bundle.outputs.artifact_version }}
      source_commit: ${{ steps.bundle.outputs.source_commit }}
      acceptance_windows: ${{ steps.bundle.outputs.acceptance_windows }}
      acceptance_linux: ${{ steps.bundle.outputs.acceptance_linux }}
      acceptance_macos: ${{ steps.bundle.outputs.acceptance_macos }}
      acceptance_android: ${{ steps.bundle.outputs.acceptance_android }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
      CORE: ${{ needs.validate.outputs.core }}
      IS_RC: ${{ needs.validate.outputs.is_rc }}
      PUBLISH: ${{ needs.validate.outputs.publish }}
      PACKAGE_RUN: ${{ inputs.package_run }}
    steps:
      - uses: actions/checkout@v7
      - name: 下载本次 RC 构建
        if: needs.validate.outputs.is_rc == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: product-packaging-*
          path: artifacts
          merge-multiple: true
      - name: 验证实际发布字节
        id: bundle
        run: |
          set -euo pipefail
          artifact_version="$VERSION"
          acc_summary=$'windows=UNVERIFIED\nlinux=UNVERIFIED\nmacos=UNVERIFIED\nandroid=UNVERIFIED'
          if [[ "$IS_RC" == "true" ]]; then
            source_commit="$GITHUB_SHA"
            if [[ "$PUBLISH" == "true" ]]; then
              manifest="$RUNNER_TEMP/ACCEPTANCE.json"
              cargo run -q -p xhup-cli --locked -- init-acceptance \
                --version "$VERSION" --source-commit "$source_commit" --artifacts-dir artifacts \
                > "$manifest"
              cargo run -q -p xhup-cli --locked -- validate-acceptance --manifest "$manifest"
              cp "$manifest" artifacts/ACCEPTANCE.json
            fi
          else
            manifest="release/acceptance-v$CORE.json"
            decision="release/qualification-v$VERSION.json"
            [[ "$(jq -er '.package_run' "$decision")" == "$PACKAGE_RUN" ]]
            source_commit="$(python3 tests/release/collect_qualification.py \
              --package-run "$PACKAGE_RUN" --out artifacts)"
            predecessor="$(jq -er '.accepted_rc' "$manifest")"
            [[ "$predecessor" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]]
            [[ "${predecessor%-rc.*}" == "$VERSION" ]]
            tag="xhup-flow-v$predecessor"
            gh release view "$tag" --json isDraft,isPrerelease \
              --jq 'select(.isDraft == false and .isPrerelease == true)' | jq -e . >/dev/null
            rc_source="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)"
            [[ "$rc_source" =~ ^[0-9a-f]{40}$ ]]
            [[ "$(gh api "repos/$GH_REPO/compare/$rc_source...$source_commit" --jq .status)" == ahead ]]
            python3 tests/release/collect_qualification.py --decision "$decision" \
              --source "$source_commit" --out qualification-proofs
            cargo run -q -p xhup-cli --locked -- validate-acceptance \
              --manifest "$manifest" --stable --expect-version "$VERSION" \
              --expect-source "$source_commit" --artifacts-dir artifacts \
              --runtime-qualification "$decision" --qualification-proofs qualification-proofs \
              --repository "$GH_REPO" --actor "$GITHUB_ACTOR"
            acc_summary="$(cargo run -q -p xhup-cli --locked -- acceptance-summary --manifest "$manifest")"
            # Attach receipts only after exact sealed inventory and all qualification gates pass.
            cp "$manifest" artifacts/ACCEPTANCE.json
            cp "$decision" artifacts/QUALIFICATION.json
            tar -czf artifacts/QUALIFICATION-PROOFS.tar.gz qualification-proofs
          fi
          {
            echo "artifact_version=$artifact_version"
            echo "source_commit=$source_commit"
            while IFS= read -r line; do echo "acceptance_$line"; done <<< "$acc_summary"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-verified-payload
          path: artifacts/
          retention-days: 7

  publish:
    name: 创建草稿 Release
    needs: [validate, prepare]
    if: >-
      ${{ always() && needs.validate.result == 'success' &&
          needs.prepare.result == 'success' && needs.validate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
      CORE: ${{ needs.validate.outputs.core }}
      IS_RC: ${{ needs.validate.outputs.is_rc }}
      # Rime 源包文件名携带其内嵌版本(schema version 行 = workspace 版本,
      # 含 -rc.N 后缀);不能用 CORE(剥后缀)拼名,RC 路径下会校验失败。
      # v1 时代 CORE == VERSION == 1.0.0,两者巧合一致,缺陷未暴露。
      RIME_VERSION: ${{ needs.prepare.outputs.artifact_version }}
      ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}

    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v8
        with:
          name: release-verified-payload
          path: artifacts

      - name: 发布前校验
        run: |
          set -euo pipefail
          cd artifacts
          for f in \
            "xhup-flow-rime-v$RIME_VERSION.zip" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-windows-x64-setup.exe" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-windows-x64.msi" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-macos-universal.dmg" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-linux-amd64.deb" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-linux-x86_64.rpm" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-android-arm64.apk" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-android-universal.apk" \
            SHA256SUMS.txt CANONICAL-SHA256SUMS.txt BUILD-INFO.txt BUILD-MANIFEST.json ACCEPTANCE.json; do
            [[ -s "$f" ]] || { echo "::error::缺少发布资产或为 0 字节: $f"; exit 1; }
          done
          # 完整性自检:SHA256SUMS 与现盘产物一致。
          sha256sum --check SHA256SUMS.txt
          echo "发布前校验通过:资产齐备、校验和一致"

      - name: 组装发布说明(草稿,人工复核)
        env:
          ACC_WINDOWS: ${{ needs.prepare.outputs.acceptance_windows }}
          ACC_LINUX: ${{ needs.prepare.outputs.acceptance_linux }}
          ACC_MACOS: ${{ needs.prepare.outputs.acceptance_macos }}
          ACC_ANDROID: ${{ needs.prepare.outputs.acceptance_android }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/RELEASE-NOTES.md"
          if [[ "$IS_RC" == "true" ]]; then
            banner="Release Candidate：尚未完成全部真实平台验收。UNVERIFIED 不代表 PASS，也不是全平台成熟正式版。"
          else
            banner="正式版本：独立构建并重新验收当前版本字节，不重命名或晋升旧 RC 附件。"
          fi
          cat > "$notes" <<EOF
          # XHUP Flow v$VERSION

          $banner

          小鹤音形输入方案与独立 Trainer。Trainer 负责训练、复习与进度备份，
          不安装或管理 Rime。具体能力及已知限制以本次源码和验收记录为准；
          本说明不复用历史版本的测试通过率、性能或平台验收成绩。

          ## 当前构建

          - 源码：[$SOURCE_COMMIT](https://github.com/$GITHUB_REPOSITORY/commit/$SOURCE_COMMIT)
          - 产品及安装包版本：\`$ARTIFACT_VERSION\`
          - 封存清单：\`BUILD-MANIFEST.json\`
          - 当前字节的验收状态：\`ACCEPTANCE.json\`
          - 正式版另附同源 CI / 全量原生资格记录与证明。

          | 平台 | 实际验收状态 |
          | --- | --- |
          | Windows | ${ACC_WINDOWS:-UNVERIFIED} |
          | Linux | ${ACC_LINUX:-UNVERIFIED} |
          | macOS | ${ACC_MACOS:-UNVERIFIED} |
          | Android | ${ACC_ANDROID:-UNVERIFIED} |

          ## 下载资产

          | 文件 | 平台 | 签名状态 |
          | --- | --- | --- |
          | \`xhup-flow-rime-v$RIME_VERSION.zip\` | 平台中立 Rime 包 | SHA-256 校验 |
          | \`xhup-flow-trainer-v$ARTIFACT_VERSION-windows-x64-setup.exe\` | Windows NSIS | UNSIGNED |
          | \`xhup-flow-trainer-v$ARTIFACT_VERSION-windows-x64.msi\` | Windows MSI | UNSIGNED |
          | \`xhup-flow-trainer-v$ARTIFACT_VERSION-macos-universal.dmg\` | macOS universal | UNSIGNED / UNNOTARIZED |
          | \`xhup-flow-trainer-v$ARTIFACT_VERSION-linux-amd64.deb\` | Linux DEB | 无格式内签名 |
          | \`xhup-flow-trainer-v$ARTIFACT_VERSION-linux-x86_64.rpm\` | Linux RPM | 无格式内签名 |
          | \`xhup-flow-trainer-v$ARTIFACT_VERSION-android-arm64.apk\` | Android ARM64 | SIGNED |
          | \`xhup-flow-trainer-v$ARTIFACT_VERSION-android-universal.apk\` | Android 兼容 APK | SIGNED |

          \`SHA256SUMS.txt\` 校验安装包；\`RELEASE-SHA256SUMS.txt\` 额外覆盖来源和验收附件。
          \`BUILD-INFO.txt\` 与 \`CANONICAL-SHA256SUMS.txt\` 提供构建和规范数据身份。
          许可证与第三方数据来源见 Rime 包内说明及绑定源码。

          ## 安装、更新与恢复

          先阅读[本次源码的安装说明](https://github.com/$GITHUB_REPOSITORY/blob/$SOURCE_COMMIT/docs/install-guide.zh-CN.md)。
          输入方案需要已有 Rime 前端及部署步骤；训练器无需 Rime。
          修改配置前备份，保留首次备份和用户词典，不覆盖无关方案或全局自定义项。
          Windows/macOS 安全提示须按系统正常流程处理，不应关闭系统防护。
          AppImage 不在本次产物范围内。

          ## 隐私与反馈

          项目本身不引入账号、遥测或云推理。输入、用户词典及训练记录留在本机。
          请通过 [Issues](https://github.com/$GITHUB_REPOSITORY/issues) 提交系统、版本、
          前端与最小复现步骤；不要上传私人词典、原始输入记录或敏感日志。
          EOF
          echo "notes=$notes" >> "$GITHUB_ENV"

      - name: 汇总全部公开附件的校验和
        run: |
          set -euo pipefail
          cd artifacts
          # Do not rewrite the SHA256SUMS already sealed by BUILD-MANIFEST.
          sha256sum -- * | LC_ALL=C sort -k2 > "$RUNNER_TEMP/RELEASE-SHA256SUMS.txt"
          cp "$RUNNER_TEMP/RELEASE-SHA256SUMS.txt" .

      - name: 创建草稿 Release(人工复核后发布)
        run: |
          set -euo pipefail
          cd artifacts
          prerelease_flag=()
          if [[ "$IS_RC" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "xhup-flow-v$VERSION" \
            --title "XHUP Flow v$VERSION" \
            --notes-file "$RUNNER_TEMP/RELEASE-NOTES.md" \
            "${prerelease_flag[@]}" --draft \
            --target "$SOURCE_COMMIT" \
            "xhup-flow-rime-v$RIME_VERSION.zip" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-windows-x64-setup.exe" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-windows-x64.msi" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-macos-universal.dmg" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-linux-amd64.deb" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-linux-x86_64.rpm" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-android-arm64.apk" \
            "xhup-flow-trainer-v$ARTIFACT_VERSION-android-universal.apk" \
            SHA256SUMS.txt RELEASE-SHA256SUMS.txt CANONICAL-SHA256SUMS.txt BUILD-INFO.txt BUILD-MANIFEST.json ACCEPTANCE.json
          if [[ "$IS_RC" == false ]]; then
            gh release upload "xhup-flow-v$VERSION" QUALIFICATION.json QUALIFICATION-PROOFS.tar.gz
          fi
          url="$(gh release view "xhup-flow-v$VERSION" --json url -q .url)"
          echo "### 草稿 Release 已创建" >> "$GITHUB_STEP_SUMMARY"
          echo "- $url(人工复核发布说明与验收状态后发布)" >> "$GITHUB_STEP_SUMMARY"
