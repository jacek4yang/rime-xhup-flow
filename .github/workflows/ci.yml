name: CI

on:
  # 全部 pull_request 都跑 CI(stacked PR 以 feature 分支为基,同样需要门禁);
  # main 的 push 保持触发。
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      # 架构防回归守卫:生成的 production Rime 产物属于 CI/dist,绝不入库;
      # 仓库根目录不得再次出现旧架构的生成词典/方案/legacy 发布文件。
      # 语义白名单:rime/templates/*.yaml.in 是模板源、tests/librime 是
      # fixture、docs 是文档 —— 守卫只针对仓库根。
      - name: 架构守卫(根目录不得含生成 Rime 产物或 legacy 发布文件)
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=()
          for name in \
            flypy_base.dict.yaml flypy_chars.dict.yaml \
            xhup_fullcode.schema.yaml xhup_fullcode.dict.yaml \
            xhup_fullcode_fixed_chars.dict.yaml \
            default.custom.yaml VERSION; do
            [[ -e "$name" ]] && found+=("$name")
          done
          for f in *.dict.yaml *.schema.yaml; do
            found+=("$f")
          done
          if ((${#found[@]} > 0)); then
            echo "::error::根目录出现禁止的生成/legacy 文件: ${found[*]}"
            exit 1
          fi
          echo "架构守卫通过:根目录无生成 Rime 产物与 legacy 发布文件"

      - name: 准备 Rust 工具链
        run: rustup show

      - name: 缓存 Cargo 下载
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: 安装 Tauri 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets --locked

      # 语料回放回归门禁:canonical 映射变更导致回放指标回退超容差即红
      # (夹具与基线见 data/corpus/README.md;断言语义见 replay-bench)。
      - name: 语料回放回归门禁
        run: >
          cargo run --locked -p xhup-analyzer --bin replay-bench --
          --input data/corpus/replay_fixture.txt
          --baseline data/corpus/replay_baseline.json

      - name: 知识库来源与证据审计
        run: cargo run --locked -p xhup-analyzer --bin knowledge-audit -- --check

      - name: XHUP 独立规则与兼容夹具审计
        run: cargo run --locked -p xhup-analyzer --bin xhup-rule-audit -- --summary --check

      - name: 上下文联合分段 foundation 基线
        run: >
          cargo run --locked -p xhup-analyzer --bin contextual-bench --
          --input data/benchmarks/contextual-v1.json
          --baseline data/benchmarks/contextual-baseline-v1.json

  trainer:
    name: trainer 前端
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Rust 工具链
        run: rustup show

      - name: 缓存 Cargo 下载
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-trainer-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            rust-trainer-${{ runner.os }}-

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖(pnpm 工作区)
        run: pnpm install --frozen-lockfile

      - name: 共享核心测试(含平台纯度守卫)
        run: pnpm core:test

      - name: 训练器单元与组件测试
        run: pnpm trainer:test

      - name: 构建训练器前端(自动生成规范训练数据)
        run: pnpm trainer:build

      - name: 小程序数据分片校验与语义测试
        run: pnpm miniapp:test

      - name: 构建微信小程序 weapp 产物
        run: pnpm miniapp:build

      - name: 小程序包体积门槛(含 JSON 报告)
        run: |
          pnpm --filter miniapp size
          pnpm --filter miniapp exec node scripts/size-report.mjs --out size-report.json

      - name: 上传小程序体积报告
        uses: actions/upload-artifact@v7
        with:
          name: miniapp-size-report
          path: miniapp/size-report.json
          if-no-files-found: error

  librime:
    name: librime runtime integration
    runs-on: ubuntu-latest
    # 1,301,434 条 extended 词汇逐条经真实 librime 查询，并在学习后复核完整
    # static 菜单；本地四分片基线约 3 小时，保留完整门禁并为 runner 波动留余量。
    timeout-minutes: 300

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Rust 工具链
        run: rustup show

      - name: 缓存 Cargo 下载
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-librime-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            rust-librime-${{ runner.os }}-

      - name: 安装 librime 运行时与开发文件(不含 Lua 插件)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librime-dev \
            librime-bin \
            rime-prelude \
            pkg-config

      - name: 打印 librime 环境
        run: |
          rime_deployer --help 2>&1 | head -3 || true
          pkg-config --modversion rime || true
          dpkg-query -W librime-dev librime-bin rime-prelude || true

      - name: 生成 Rime 包
        run: cargo run -p xhup-cli --locked -- generate rime --output /tmp/xhup-flow-package

      - name: 导出全静态菜单 manifest 并构建 xhup-cli
        run: |
          cargo run -p xhup-analyzer --locked --bin static-shortcut-audit -- \
            --dump-static-menu-manifest /tmp/static-menu.manifest
          cargo run -p xhup-analyzer --locked --bin static-shortcut-audit -- \
            --dump-extended-reachability-manifest /tmp/extended-reachability.manifest
          cargo run -p xhup-analyzer --locked --bin static-shortcut-audit -- \
            --dump-extended-reachability-manifest /tmp/extended-reachability.second.manifest
          cmp /tmp/extended-reachability.manifest /tmp/extended-reachability.second.manifest
          cargo run -p xhup-analyzer --locked --bin static-shortcut-audit -- \
            --dump-open-composition-manifest /tmp/open-composition.manifest
          cargo run -p xhup-analyzer --locked --bin static-shortcut-audit -- \
            --dump-open-composition-manifest /tmp/open-composition.second.manifest
          cmp /tmp/open-composition.manifest /tmp/open-composition.second.manifest
          cargo build -p xhup-cli --locked

      # 降级语义门禁:主方案引用 lua_filter 但环境无 librime-lua 时,
      # librime 必须跳过该组件且全部输入行为完整(docs/lua-runtime.md §2)。
      - name: librime session 冒烟(无 Lua 插件降级路径 + canonical v2 哨兵)
        run: tests/librime/run-runtime-smoke.sh /tmp/xhup-flow-package

      - name: 安装 librime-lua 插件与 Lua 解释器
        run: |
          sudo apt-get install -y --no-install-recommends \
            librime-plugin-lua \
            lua5.4

      - name: Lua quick_hint 纯逻辑单测(lua5.4,不依赖 librime)
        run: lua5.4 tests/lua/test_quick_hint.lua

      - name: Lua quick_hint 模块级仿真(真实生成数据 + require 路径约定)
        run: lua5.4 tests/lua/sim_quick_hint.lua /tmp/xhup-flow-package

      - name: librime Lua quick_hint 审计(真实插件:提示注释 + 次序不变)
        run: tests/librime/run-lua-audit.sh /tmp/xhup-flow-package

      - name: librime Flow 引擎审计(全静态等值 + 组句 + 学习持久化 + 学习管理)
        run: >
          tests/librime/run-flow-audit.sh /tmp/xhup-flow-package
          /tmp/static-menu.manifest target/debug/xhup-cli
          /tmp/extended-reachability.manifest /tmp/open-composition.manifest

      - name: librime 真实部署路径审计(rime_deployer --build 全量构建 + 冒烟)
        run: tests/librime/run-deploy-audit.sh /tmp/xhup-flow-package

      - name: librime 日常输入控制(ASCII/标点/数字选择/翻页/Escape/Enter)
        run: tests/librime/run-ime-controls.sh /tmp/xhup-flow-package

  native-smoke:
    name: 原生冒烟(${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Rust 工具链
        run: rustup show

      - name: 缓存 Cargo 下载
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: native-smoke-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            native-smoke-${{ matrix.os }}-

      - name: 安装 Tauri 编译依赖(仅 Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 平台原生冒烟(产品管理核心 + 学习管理,全部封闭假目录)
        run: |
          cargo test -p trainer --lib --locked
          cargo test -p xhup-cli --lib --locked
