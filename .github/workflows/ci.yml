name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Rust 工具链
        run: rustup show

      - name: 缓存 Cargo 下载
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: 安装 Tauri 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets --locked

  trainer:
    name: trainer 前端
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Rust 工具链
        run: rustup show

      - name: 缓存 Cargo 下载
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-trainer-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            rust-trainer-${{ runner.os }}-

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: trainer/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: trainer/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm -C trainer install --frozen-lockfile

      - name: 单元与组件测试
        run: pnpm -C trainer test

      - name: 构建前端(自动生成规范训练数据)
        run: pnpm -C trainer build

  librime:
    name: librime runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Rust 工具链
        run: rustup show

      - name: 缓存 Cargo 下载
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-librime-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            rust-librime-${{ runner.os }}-

      - name: 安装 librime 运行时与开发文件
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librime-dev \
            librime-bin \
            rime-prelude \
            pkg-config

      - name: 打印 librime 环境
        run: |
          rime_deployer --help 2>&1 | head -3 || true
          pkg-config --modversion rime || true
          dpkg-query -W librime-dev librime-bin rime-prelude || true

      - name: 生成 Rime 包
        run: cargo run -p xhup-cli --locked -- generate rime --output /tmp/xhup-flow-package

      - name: 导出 FIXED_FIRST 审计 manifest
        run: >
          cargo run -p xhup-analyzer --locked --bin shortcut-optimize --
          --dump-fixed-first-audit-manifest /tmp/fixed-first.manifest

      - name: 导出二码零冲突审计 manifest
        run: >
          cargo run -p xhup-analyzer --locked --bin static-shortcut-audit --
          --dump-two-key-audit-manifest /tmp/two-key.manifest

      - name: librime session 冒烟测试(priority preflight + 冒烟 + 全量 A/B 审计 + 二码审计)
        run: >
          tests/librime/run-runtime-smoke.sh /tmp/xhup-flow-package
          /tmp/fixed-first.manifest /tmp/two-key.manifest
