name: CI

on:
  # 全部 pull_request 都跑 CI(stacked PR 以 feature 分支为基,同样需要门禁);
  # main 的 push 保持触发。
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Rust 工具链
        run: rustup show

      - name: 缓存 Cargo 下载
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: 安装 Tauri 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets --locked

  trainer:
    name: trainer 前端
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Rust 工具链
        run: rustup show

      - name: 缓存 Cargo 下载
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-trainer-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            rust-trainer-${{ runner.os }}-

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖(pnpm 工作区)
        run: pnpm install --frozen-lockfile

      - name: 共享核心测试(含平台纯度守卫)
        run: pnpm core:test

      - name: 训练器单元与组件测试
        run: pnpm trainer:test

      - name: 构建训练器前端(自动生成规范训练数据)
        run: pnpm trainer:build

      - name: 小程序数据分片校验与语义测试
        run: pnpm miniapp:test

      - name: 构建微信小程序 weapp 产物
        run: pnpm miniapp:build

      - name: 小程序包体积门槛(含 JSON 报告)
        run: |
          pnpm --filter miniapp size
          pnpm --filter miniapp exec node scripts/size-report.mjs --out size-report.json

      - name: 上传小程序体积报告
        uses: actions/upload-artifact@v7
        with:
          name: miniapp-size-report
          path: miniapp/size-report.json
          if-no-files-found: error

  librime:
    name: librime runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Rust 工具链
        run: rustup show

      - name: 缓存 Cargo 下载
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-librime-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            rust-librime-${{ runner.os }}-

      - name: 安装 librime 运行时与开发文件(不含 Lua 插件)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librime-dev \
            librime-bin \
            rime-prelude \
            pkg-config

      - name: 打印 librime 环境
        run: |
          rime_deployer --help 2>&1 | head -3 || true
          pkg-config --modversion rime || true
          dpkg-query -W librime-dev librime-bin rime-prelude || true

      - name: 生成 Rime 包
        run: cargo run -p xhup-cli --locked -- generate rime --output /tmp/xhup-flow-package

      - name: 导出 FIXED_FIRST 审计 manifest
        run: >
          cargo run -p xhup-analyzer --locked --bin shortcut-optimize --
          --dump-fixed-first-audit-manifest /tmp/fixed-first.manifest

      - name: 导出二码零冲突审计 manifest
        run: >
          cargo run -p xhup-analyzer --locked --bin static-shortcut-audit --
          --dump-two-key-audit-manifest /tmp/two-key.manifest

      - name: 导出全静态菜单 manifest 并构建 xhup-cli
        run: |
          cargo run -p xhup-analyzer --locked --bin static-shortcut-audit -- \
            --dump-static-menu-manifest /tmp/static-menu.manifest
          cargo build -p xhup-cli --locked

      # 降级语义门禁:主方案引用 lua_filter 但环境无 librime-lua 时,
      # librime 必须跳过该组件且全部输入行为完整(docs/lua-runtime.md §2)。
      - name: librime session 冒烟(无 Lua 插件降级路径 + 全量 A/B + 二码)
        run: >
          tests/librime/run-runtime-smoke.sh /tmp/xhup-flow-package
          /tmp/fixed-first.manifest /tmp/two-key.manifest

      - name: 安装 librime-lua 插件与 Lua 解释器
        run: |
          sudo apt-get install -y --no-install-recommends \
            librime-plugin-lua \
            lua5.4

      - name: Lua quick_hint 纯逻辑单测(lua5.4,不依赖 librime)
        run: lua5.4 tests/lua/test_quick_hint.lua

      - name: librime Lua quick_hint 审计(真实插件:提示注释 + 次序不变)
        run: tests/librime/run-lua-audit.sh /tmp/xhup-flow-package

      - name: librime Flow 引擎审计(全静态等值 + 组句 + 学习持久化 + 学习管理)
        run: >
          tests/librime/run-flow-audit.sh /tmp/xhup-flow-package
          /tmp/static-menu.manifest target/debug/xhup-cli

      - name: librime 日常输入控制(ASCII/标点/数字选择/翻页/Escape/Enter)
        run: tests/librime/run-ime-controls.sh /tmp/xhup-flow-package

  native-smoke:
    name: 原生冒烟(${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Rust 工具链
        run: rustup show

      - name: 缓存 Cargo 下载
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: native-smoke-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            native-smoke-${{ matrix.os }}-

      - name: 安装 Tauri 编译依赖(仅 Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 平台原生冒烟(产品管理核心 + 学习管理,全部封闭假目录)
        run: |
          cargo test -p trainer --lib --locked
          cargo test -p xhup-cli --lib --locked
