name: CI

on:
  # 全部 pull_request 都跑 CI(stacked PR 以 feature 分支为基,同样需要门禁);
  # main 的 push 保持触发。
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    # 30 分钟在 runner 慢时被全量测试吃满(2026-09-16 复现);45 留余量。
    timeout-minutes: 45

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      # 架构防回归守卫:生成的 production Rime 产物属于 CI/dist,绝不入库;
      # 仓库根目录不得再次出现旧架构的生成词典/方案/legacy 发布文件。
      # 语义白名单:rime/templates/*.yaml.in 是模板源、tests/librime 是
      # fixture、docs 是文档 —— 守卫只针对仓库根。
      - name: 架构守卫(根目录不得含生成 Rime 产物或 legacy 发布文件)
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=()
          for name in \
            flypy_base.dict.yaml flypy_chars.dict.yaml \
            xhup_fullcode.schema.yaml xhup_fullcode.dict.yaml \
            xhup_fullcode_fixed_chars.dict.yaml \
            default.custom.yaml VERSION; do
            [[ -e "$name" ]] && found+=("$name")
          done
          for f in *.dict.yaml *.schema.yaml; do
            found+=("$f")
          done
          if ((${#found[@]} > 0)); then
            echo "::error::根目录出现禁止的生成/legacy 文件: ${found[*]}"
            exit 1
          fi
          echo "架构守卫通过:根目录无生成 Rime 产物与 legacy 发布文件"

      - name: 准备 Rust 工具链
        run: rustup show

      - name: 缓存 Cargo 下载
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: 安装 Tauri 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: 规范读音上游独立重建（固定提交及 SHA256）
        run: |
          python3 -m unittest discover -s data/hanzi -p 'test_*.py'
          mkdir /tmp/xhup-reading-inputs
          for file in kMandarin_8105.txt kTGHZ2013.txt; do
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/mozillazg/pinyin-data/923b108dc5d45dee061324c011b478fb649f8b73/$file" \
              -o "/tmp/xhup-reading-inputs/$file"
          done
          python3 data/hanzi/reconstruct_readings.py \
            --source-dir /tmp/xhup-reading-inputs --check data/hanzi/readings.tsv

      - name: 可分发来源门禁回归（合成 depfile，不是实际编译证据）
        run: python3 -m unittest discover -s tests/release -p 'test_distribution_sources.py'

      - name: GLib 定界回移源码与许可门禁（不是忽略其它 advisories）
        run: |
          python3 tests/security/check_glib_backport.py
          python3 tests/security/check_rust_maintenance.py
          python3 -m unittest discover -s tests/security -p 'test_*.py'
          cargo fetch --locked
          python3 tests/security/check_macro_diagnostic.py

      - name: RustSec 完整审计（含维护警告，无忽略）
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets --locked

      # 工作流 run 块 shell 语法守卫:块内多行引号/here-doc 不配对时,bash 会在
      # 解析阶段整体失败(与运行分支无关),曾导致 rc-release 的「组装发布说明」
      # 步骤在创建草稿 Release 时以 `unexpected EOF while looking for matching`
      # 失败(2.0.0-rc.2)。毫秒级、无第三方依赖。
      - name: 工作流 run 块 shell 语法守卫
        run: |
          python3 tests/release/check_workflow_shell.py
          python3 -m unittest discover -s tests/release -p 'test_packaging_runtime_gates.py'

      # 语料回放回归门禁:canonical 映射变更导致回放指标回退超容差即红
      # (夹具与基线见 data/corpus/README.md;断言语义见 replay-bench)。
      - name: 语料回放回归门禁
        run: >
          cargo run --locked -p xhup-analyzer --bin replay-bench --
          --input data/corpus/replay_fixture.txt
          --baseline data/corpus/replay_baseline.json

      # 上下文回放回归门禁(§20 harmful reorder rate / §24 DoD):
      # 真实语料逐 token 回放,断言 committed-context 的相对基线读数不退化。
      # 基线含 rank1 命中、上下文收益、有害重排与期望选择成本;任何一项
      # 漂移即红(精确比较,不含计时)。放在 Rust job 而非 librime job,
      # 因为它是纯 Rust 评测,不该占用 5 小时的关键路径。
      - name: 上下文回放回归门禁(context gain / harmful reorder)
        run: >
          cargo run --locked -p xhup-analyzer --bin context-replay-bench --
          --sentences data/corpus/replay_fixture.txt
          --bigram data/corpus/kdconv_bigram.tsv
          --baseline data/benchmarks/context-replay-baseline.json

      - name: 多源证据量纲与消融报告（研究回归，不是独立质量验收）
        run: |
          cargo run --locked -p xhup-analyzer --bin evidence-scales-audit > /tmp/evidence-scales.json
          diff -u data/benchmarks/evidence-scales-v1.json /tmp/evidence-scales.json

      - name: 知识库来源与证据审计
        run: cargo run --locked -p xhup-analyzer --bin knowledge-audit -- --check

      - name: XHUP 独立规则与兼容夹具审计
        run: cargo run --locked -p xhup-analyzer --bin xhup-rule-audit -- --summary --check

      - name: 上下文联合分段 foundation 基线
        run: >
          cargo run --locked -p xhup-analyzer --bin contextual-bench --
          --input data/benchmarks/contextual-v1.json
          --baseline data/benchmarks/contextual-baseline-v1.json

  trainer:
    name: trainer 前端
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Rust 工具链
        run: rustup show

      - name: 缓存 Cargo 下载
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-trainer-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            rust-trainer-${{ runner.os }}-

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖(pnpm 工作区)
        run: pnpm install --frozen-lockfile

      - name: 下载与模板压缩依赖适配回归（本地服务器与合成归档）
        run: TARO_ENV=weapp node --test tests/security/frontend-dependencies.test.cjs

      - name: 前端完整依赖公告门禁（含开发工具，无忽略）
        run: pnpm audit --audit-level low

      - name: 共享核心测试(含平台纯度守卫)
        run: pnpm core:test

      - name: 训练器单元与组件测试
        run: pnpm trainer:test

      - name: 构建训练器前端(自动生成规范训练数据)
        run: pnpm trainer:build

      - name: 小程序数据分片校验与语义测试
        run: pnpm miniapp:test

      - name: 构建微信小程序 weapp 产物
        run: pnpm miniapp:build

      - name: 小程序包体积门槛(含 JSON 报告)
        run: |
          pnpm --filter miniapp size
          pnpm --filter miniapp exec node scripts/size-report.mjs --out size-report.json

      - name: 上传小程序体积报告
        uses: actions/upload-artifact@v7
        with:
          name: miniapp-size-report
          path: miniapp/size-report.json
          if-no-files-found: error

  librime:
    name: librime runtime smoke
    # Keep the old-binding fallback reproducible alongside the pinned new binding.
    runs-on: ubuntu-24.04
    # 轻量冒烟(#132):真实 librime 会话 + Lua 合同/单测/仿真 + 真实插件
    # Lua 审计 + 日常输入控制,全部分钟级。穷尽式审计(全静态等值 1.3M 项
    # 流程、rime_deployer --build 全量部署)已移至 full-regression.yml
    # (main push / nightly / 手动),不在 PR 关键路径上。
    timeout-minutes: 40

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Rust 工具链
        run: rustup show

      - name: 缓存 Cargo 下载
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-librime-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            rust-librime-${{ runner.os }}-

      - name: 安装 librime 运行时与开发文件(不含 Lua 插件)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librime-dev \
            librime-bin \
            rime-prelude \
            pkg-config

      - name: 原生学习快照所有权与历史迁移回归
        run: cargo test -p xhup-cli --locked --test learning_native -- --ignored

      - name: 原生审计输入与失败状态负向回归（不是产品输入验收）
        run: python3 -m unittest discover -s tests/librime -p 'test_audit_input.py'

      - name: 编译逐键资格门禁（仅编译，不代表回归已通过）
        run: cc -std=c11 -O2 -Wall -Wextra -Werror tests/librime/runtime_replay.c $(pkg-config --cflags --libs rime) -o /tmp/xhup-native-replay

      - name: 打印 librime 环境
        run: |
          rime_deployer --help 2>&1 | head -3 || true
          pkg-config --modversion rime || true
          dpkg-query -W librime-dev librime-bin rime-prelude || true

      - name: 生成 Rime 包
        run: |
          cargo run -p xhup-cli --locked -- generate rime --output /tmp/xhup-flow-package
          python3 tests/release/check_distribution_sources.py --depfile target/debug/xhup-cli.d
          python3 tests/release/test_generated_runtime_sources.py
          python3 tests/release/check_generated_runtime_sources.py /tmp/xhup-flow-package

      - name: 构建 xhup-cli(doctor 与学习管理使用)
        run: cargo build -p xhup-cli --locked

      # 纯静态回退与无插件降级门禁: xhup_flow_static 保持零 Lua 运行,
      # 无插件时只承诺独立 Static;主方案的原生边界提供者需要 Lua。
      - name: librime session 冒烟(无插件纯静态回退)
        run: XHUP_SMOKE_STATIC_ONLY=1 tests/librime/run-runtime-smoke.sh /tmp/xhup-flow-package

      - name: 安装 librime-lua 插件与 Lua 解释器
        run: |
          sudo apt-get install -y --no-install-recommends \
            librime-plugin-lua \
            lua5.4

      - name: 旧版 Lua 只读降级（真实输入、明确拒绝学习、重启无写入）
        run: XHUP_AUDIT_ONLY_REPLAY=1 XHUP_REPLAY_VERIFY_READONLY=1 tests/librime/run-flow-audit.sh /tmp/xhup-flow-package

      - name: 构建并安装具备有界学习 API 的固定源码 Lua 插件
        run: |
          sudo apt-get install -y --no-install-recommends \
            liblua5.4-dev libopencc-dev libgoogle-glog-dev libboost-dev \
            libmarisa-dev libyaml-cpp-dev libx11-dev darts
          bash tests/librime/build-supported-lua.sh /tmp/xhup-supported-lua
          plugin=$(dpkg -L librime-plugin-lua | grep '/librime-lua.so$')
          test -n "$plugin"
          sudo install -m 755 /tmp/xhup-supported-lua/librime-lua.so "$plugin"

      - name: librime session 冒烟(固定新版 Lua 环境的完整 Flow + Static)
        run: tests/librime/run-runtime-smoke.sh /tmp/xhup-flow-package

      - name: Lua runtime 合同与自检单测(lua5.4,不依赖 librime)
        run: lua5.4 tests/lua/test_contract.lua

      - name: Lua quick_hint 纯逻辑单测(lua5.4,不依赖 librime)
        run: lua5.4 tests/lua/test_quick_hint.lua

      - name: Lua context_ranker 纯逻辑单测(lua5.4,不依赖 librime)
        run: |
          lua5.4 tests/lua/test_context_ranker.lua
          lua5.4 tests/lua/test_ranker_stream.lua
          lua5.4 tests/lua/test_native_tail.lua
          lua5.4 tests/lua/test_full_span.lua

      - name: Lua 会话隐私与历史研究快照单测(lua5.4,非原生验收)
        run: |
          lua5.4 tests/lua/test_session_memory.lua
          lua5.4 tests/lua/test_user_memory.lua
          lua5.4 tests/lua/test_user_memory_failures.lua

      - name: Lua native_lookup 纯逻辑单测(lua5.4,不依赖 librime)
        run: lua5.4 tests/lua/test_native_lookup.lua
      - name: 历史研究 joint_decoder 决策单测(不是已部署解码器)
        run: lua5.4 tests/lua/test_joint_decoder.lua

      - name: Lua joint lattice 夹具一致性(Rust/Lua 共享夹具)
        run: lua5.4 tests/lua/sim_native_lookup.lua

      - name: Lua quick_hint 模块级仿真(真实生成数据 + require 路径约定)
        run: lua5.4 tests/lua/sim_quick_hint.lua /tmp/xhup-flow-package

      - name: Lua context_ranker 模块级仿真(真实生成数据,强固定识别抽样)
        run: lua5.4 tests/lua/sim_context_ranker.lua /tmp/xhup-flow-package

      # Lua 运行时内存基线(§22 Lua memory / GC;此前无任何基线)。
      # 只报告数值 + 断言「无泄漏」这一机器无关性质;不设跨机器内存门槛。
      - name: Lua 运行时内存基线(§22 memory / GC)
        run: lua5.4 tests/lua/measure_memory.lua /tmp/xhup-flow-package

      - name: xhup-cli doctor 运行环境与 Lua 合同诊断
        run: target/debug/xhup-cli doctor --user-data-dir /tmp/xhup-flow-package

      - name: librime 逐键资格门禁（尾码、分段、编辑与完整提交）
        run: XHUP_AUDIT_ONLY_REPLAY=1 XHUP_REPLAY_VERIFY_LEARNING=1 tests/librime/run-flow-audit.sh /tmp/xhup-flow-package

      - name: librime Lua quick_hint 审计(真实插件:提示注释 + 次序不变)
        run: tests/librime/run-lua-audit.sh /tmp/xhup-flow-package

      - name: librime Lua context_ranker 审计(真实插件:默认关闭恒等 + 有界提升 + 固定 rank-1 + OOV)
        run: tests/librime/run-context-ranker-audit.sh /tmp/xhup-flow-package

      # Production Shortcut Audit(§3/§9/§10;§24 DoD misleading-hint rate 门禁):
      # 全部 advertised shortcut(quick-hint 提示视图)逐条对照 canonical
      # 真实菜单;任何 misleading 即门禁红(阈值 0)。纯 Rust 评测(分钟级),
      # 留在 PR CI;穷尽式 librime 流程审计见 full-regression.yml。
      - name: Production Shortcut Audit(misleading-hint rate 门禁)
        run: >
          cargo run --locked -p xhup-analyzer --bin production-shortcut-audit --
          --output /tmp/shortcut-audit.tsv --threshold 0.0

      - name: librime 日常输入控制(ASCII/标点/数字选择/翻页/Escape/Enter)
        run: tests/librime/run-ime-controls.sh /tmp/xhup-flow-package

      # 学习/持久化聚焦回归(#151/#152):Flow 与 learn translator 共享
      # xhup_flow_user,两侧音节 id 空间必须一致,学习条目必须经产品同款
      # 导出路径可观察且码唯一。分钟级,留在 PR 关键路径;
      # 全静态等值等穷尽审计仍由 full-regression.yml 全量模式覆盖。
      - name: librime Flow 学习/持久化聚焦回归(导出可观察性 + 重启 + 学习管理)
        run: >
          tests/librime/run-learning-export.sh /tmp/xhup-flow-package
          target/debug/xhup-cli

  native-smoke:
    name: 原生冒烟(${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Rust 工具链
        run: rustup show

      - name: 缓存 Cargo 下载
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: native-smoke-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            native-smoke-${{ matrix.os }}-

      - name: 安装 Tauri 编译依赖(仅 Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 平台原生冒烟(产品管理核心 + 学习管理,全部封闭假目录)
        run: |
          cargo test -p trainer --lib --locked
          cargo test -p xhup-cli --lib --locked
