packages:
  - trainer
  - packages/*
  - miniapp

allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  "@swc/core": true
  "@tarojs/binding": true
  core-js: false
  core-js-pure: false
  '@tarojs/cli': true

overrides:
  webpack: 5.111.1
  # Same-major security patches; test both Trainer and miniapp production builds.
  brace-expansion@^1.1.0: 1.1.21
  brace-expansion@^2.0.1: 2.1.7
  brace-expansion@^5.0.0: 5.0.12
  'postcss@>=8.0.0 <8.5.23': 8.5.23
  'qs@>=6.0.0 <6.16.0': 6.16.0
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'http-cache-semantics@>=4.0.0 <4.1.1': 4.1.1
