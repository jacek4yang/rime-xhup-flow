# Rime schema
# encoding: utf-8
---
# 优先级栅栏预检 fixture 的 CONTROL 变体:仅 primary translator。
# 真实 session 必须输出 甲 乙 丙(无 secondary 候选)。
# 仅用于 tests/librime 的 runtime 预检,不是 production 方案。
schema:
  schema_id: preflight_control
  name: 优先级栅栏预检(控制组)
  version: "1"
  author:
    - XHUP Flow
  description: |
    initial_quality 优先级栅栏的 runtime 机制预检(控制组)。

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]

engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - table_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba

translator:
  dictionary: preflight_primary
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 1000000

punctuator:
  import_preset: default

key_binder:
  import_preset: default
