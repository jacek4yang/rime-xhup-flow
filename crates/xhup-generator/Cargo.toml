[package]
name = "xhup-generator"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# Explicit local research tests only; never enables data in non-test binaries.
research-sogou = []

[dependencies]
full_moon = { version = "=3.0.0", default-features = false }
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
xhup-core = { path = "../xhup-core" }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
